# 部署人力资源云：推送 tag（provider/*）时构建镜像并部署到阿里云 FC。
#
# 前置条件：
#   - ACR 仓库 quanttide/qtcloud-human-provider 已由主账号创建（PUBLIC）
#   - OSS 状态桶 quanttide-terraform-state 已存在
# 所需 secrets（org 级）：ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET /
#   ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD / ALIYUN_ACR_REGISTRY / DOCKERHUB_USERNAME / DOCKERHUB_PASSWORD

name: Deploy Provider

on:
  push:
    tags:
      - 'provider/**'

concurrency:
  group: deploy-human-provider
  cancel-in-progress: false

env:
  TF_VAR_region: cn-hangzhou
  TF_VAR_environment: prod
  TF_VAR_cors_origins: https://human.cloud.quanttide.com
  TF_VAR_qtrecurit_dry_run_default: "true"
  TF_VAR_allow_real_recruitment_actions: "false"
  TF_VAR_qtrecurit_timeout_seconds: "60"
  TF_STATE_BUCKET: quanttide-terraform-state
  TF_STATE_KEY: qtcloud-human/terraform.tfstate
  ACR_NAMESPACE: quanttide

jobs:
  build-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve Image Tag
        id: image
        run: |
          TAG="${GITHUB_REF_NAME#provider/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/provider/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/qtcloud-human-provider:${{ steps.image.outputs.tag }}
            ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/qtcloud-human-provider:latest

  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 30
    env:
      ALICLOUD_ACCESS_KEY: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALICLOUD_SECRET_KEY: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALICLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALICLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALICLOUD_REGION_ID: cn-hangzhou

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Image Name
        run: |
          TAG="${GITHUB_REF_NAME#provider/}"
          echo "TF_VAR_image=${{ secrets.ALIYUN_ACR_REGISTRY }}/${ACR_NAMESPACE}/qtcloud-human-provider:${TAG}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Terraform Init
        working-directory: manifests/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.TF_VAR_region }}"

      - name: Terraform Validate
        working-directory: manifests/terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: manifests/terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        working-directory: manifests/terraform
        run: terraform apply -input=false -no-color tfplan
