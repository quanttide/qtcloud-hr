# 手动引导 provider 的 Linux/FC 可用 lark-cli HR 邮箱认证态。
#
# 运行前提：
#   - GitHub repository secret: QTCLOUD_HUMAN_LARK_CLI_APP_SECRET
#   - GitHub repository variables:
#       QTCLOUD_HUMAN_LARK_CLI_APP_ID
#       QTCLOUD_HUMAN_LARK_CLI_CREDENTIALS_OSS_BUCKET
#       QTCLOUD_HUMAN_LARK_CLI_CREDENTIALS_OSS_PREFIX
#       QTCLOUD_HUMAN_LARK_CLI_CREDENTIALS_OSS_ENDPOINT（可选）
#   - org/repo secrets: ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET

name: Bootstrap Lark CLI Credentials

on:
  workflow_dispatch:
    inputs:
      mailbox:
        description: HR mailbox to verify before uploading credentials
        required: true
        default: hr@quanttide.com

concurrency:
  group: bootstrap-lark-cli-credentials
  cancel-in-progress: false

env:
  HR_MAILBOX: ${{ inputs.mailbox }}
  LARKSUITE_CLI_CONFIG_DIR: ${{ github.workspace }}/.lark-cli
  LARKSUITE_CLI_DATA_DIR: ${{ github.workspace }}/.local/share
  LARKSUITE_CLI_NO_SKILLS_NOTIFIER: "1"
  LARKSUITE_CLI_NO_UPDATE_NOTIFIER: "1"
  OSS_BUCKET: ${{ vars.QTCLOUD_HUMAN_LARK_CLI_CREDENTIALS_OSS_BUCKET }}
  OSS_PREFIX: ${{ vars.QTCLOUD_HUMAN_LARK_CLI_CREDENTIALS_OSS_PREFIX }}
  OSS_ENDPOINT: ${{ vars.QTCLOUD_HUMAN_LARK_CLI_CREDENTIALS_OSS_ENDPOINT || 'oss-cn-hangzhou.aliyuncs.com' }}
  LARK_CLI_APP_ID: ${{ vars.QTCLOUD_HUMAN_LARK_CLI_APP_ID }}
  LARK_CLI_APP_SECRET: ${{ secrets.QTCLOUD_HUMAN_LARK_CLI_APP_SECRET }}

jobs:
  bootstrap:
    name: Authorize HR Mailbox and Upload Credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          test -n "${LARK_CLI_APP_ID}" || { echo "QTCLOUD_HUMAN_LARK_CLI_APP_ID variable is required." >&2; exit 1; }
          test -n "${LARK_CLI_APP_SECRET}" || { echo "QTCLOUD_HUMAN_LARK_CLI_APP_SECRET secret is required." >&2; exit 1; }
          test -n "${OSS_BUCKET}" || { echo "QTCLOUD_HUMAN_LARK_CLI_CREDENTIALS_OSS_BUCKET variable is required." >&2; exit 1; }
          test -n "${OSS_PREFIX}" || { echo "QTCLOUD_HUMAN_LARK_CLI_CREDENTIALS_OSS_PREFIX variable is required." >&2; exit 1; }

      - name: Install lark-cli
        run: npm install -g @larksuite/cli@1.0.79

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Initialize lark-cli app config
        run: |
          mkdir -p "${LARKSUITE_CLI_CONFIG_DIR}" "${LARKSUITE_CLI_DATA_DIR}"
          printf '%s' "${LARK_CLI_APP_SECRET}" \
            | lark-cli config init \
                --app-id "${LARK_CLI_APP_ID}" \
                --app-secret-stdin \
                --brand feishu

      - name: Start HR mailbox authorization
        id: auth
        run: |
          auth_json="$(lark-cli auth login --domain mail --no-wait --json)"
          verification_url="$(printf '%s' "$auth_json" | jq -r '.data.verification_url // .data.verification_uri_complete // .verification_url // .verification_uri_complete')"
          device_code="$(printf '%s' "$auth_json" | jq -r '.data.device_code // .device_code')"
          if [ -z "$verification_url" ] || [ "$verification_url" = "null" ] || [ -z "$device_code" ] || [ "$device_code" = "null" ]; then
            echo "Unable to parse lark-cli device authorization response." >&2
            exit 1
          fi
          echo "device_code=$device_code" >> "$GITHUB_OUTPUT"
          lark-cli auth qrcode "$verification_url" --output lark-auth-qr.png
          echo "Open this URL and authorize the HR mailbox user: $verification_url"
          {
            echo "## HR mailbox authorization"
            echo
            echo "Open this URL and authorize the HR mailbox user: ${verification_url}"
            echo
            echo "QR code artifact: lark-auth-qr"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload authorization QR code
        uses: actions/upload-artifact@v4
        with:
          name: lark-auth-qr
          path: lark-auth-qr.png
          retention-days: 1

      - name: Complete HR mailbox authorization
        run: lark-cli auth login --device-code '${{ steps.auth.outputs.device_code }}'

      - name: Verify HR mailbox access
        run: |
          lark-cli mail user_mailbox.folders list \
            --user-mailbox-id "${HR_MAILBOX}" \
            --folder-type 1 \
            --as user \
            --format json \
            | jq -e '.ok == true and (.data.items | length > 0)' >/dev/null

      - name: Upload Linux credentials to private OSS prefix
        run: |
          prefix="${OSS_PREFIX%/}"
          ossutil cp "${LARKSUITE_CLI_CONFIG_DIR}/" "oss://${OSS_BUCKET}/${prefix}/.lark-cli/" -r -f
          ossutil cp "${LARKSUITE_CLI_DATA_DIR}/lark-cli/" "oss://${OSS_BUCKET}/${prefix}/.local/share/lark-cli/" -r -f
